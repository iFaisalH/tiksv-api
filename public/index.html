<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok Downloader</title>
  <link rel="icon" href="https://lf16-tiktok-common.ttwstatic.com/obj/tiktok-web-common-sg/mtact/static/images/logo_144c91a.png?v=2" type="image/png" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="brand-icon" src="https://lf16-tiktok-common.ttwstatic.com/obj/tiktok-web-common-sg/mtact/static/images/logo_144c91a.png?v=2" width="44" height="44" alt="TikTok" />
      <h1><b>TikTok</b> Downloader</h1>

    <form id="form" class="form">
      <input id="input" type="text" spellcheck="false" autocomplete="off" placeholder="Paste link or video ID" />
      <button type="submit" id="submit">Download</button>
    </form>
    <p class="error" id="error" hidden></p>
  </div>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
