<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><meta name="theme-color" content="#10121b"/><title>TapTop ألعاب</title><style>
:root{--bg:#10121b;--panel:#1a1e2c;--tile:#2b3045;--text:#f3f7ff;--muted:#a4b1cd;--accent:#73f1ba}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{touch-action:pan-y}main{max-width:620px;min-height:100svh;margin:auto;padding:14px 12px 38px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0;line-height:1.35}#sub{font-size:13px;color:var(--muted);margin:5px 0 0}#game{background:var(--panel);border:1px solid #333950;box-shadow:0 10px 40px #070a1740;border-radius:22px;padding:15px;min-height:340px;overflow:hidden}#status{font-size:16px;min-height:30px;text-align:center;color:var(--accent);font-weight:700;margin:9px 0 13px}#stage{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;min-height:280px;touch-action:pan-y}button{appearance:none;border:none;background:#363f5c;color:white;border-radius:13px;padding:11px 15px;font-weight:750;font-family:inherit;font-size:15px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}button:disabled{opacity:.6}button.primary{background:linear-gradient(135deg,#40bf8a,#139777);color:#081c16}.toolbar{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted);font-size:13px;text-align:center;line-height:1.6}.board{display:grid;width:min(92vw,390px);aspect-ratio:1;gap:5px;padding:7px;background:#111725;border-radius:13px;user-select:none;touch-action:none}.cell{border-radius:8px;display:flex;align-items:center;justify-content:center;background:#252c40;font-size:20px;font-weight:850;transition:background .1s;min-width:0}.cell.tap{cursor:pointer}.board.compact{gap:3px}.board.compact .cell{font-size:18px}.cell.fruit{border-radius:50%;box-shadow:inset 0 -5px #0002}.pieces{display:flex;gap:9px;justify-content:center;width:100%}.piece{display:grid;gap:2px;padding:8px;border:2px solid #525b7a;border-radius:12px;min-width:78px;min-height:75px;align-content:center;justify-content:center;cursor:pointer}.piece.selected{border-color:#73f1ba;background:#24483f}.piece div{width:16px;height:16px;background:#58c5ef;border-radius:3px}.bottles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:15px}.bottle{width:55px;height:138px;border:3px solid #aab7d8;border-top:0;border-radius:6px 6px 13px 13px;display:flex;flex-direction:column-reverse;justify-content:flex-start;overflow:hidden;cursor:pointer}.bottle.selected{box-shadow:0 0 0 4px #66e3bd80;transform:translateY(-10px)}.liquid{height:25%;border-bottom:1px solid #fff3}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:390px}.flip{height:75px;font-size:32px;border-radius:10px;background:#454f70;display:grid;place-items:center;cursor:pointer}.flip.open{background:#dce6f6;color:#111}.buttonrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.buttonrow button{min-width:70px}.stagebig{width:100%;min-height:270px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:#303a57;font-size:68px;cursor:pointer;user-select:none;position:relative;overflow:hidden}.runway{height:380px;width:min(92vw,310px);background:repeating-linear-gradient(to bottom,#222b40 0 34px,#28364b 34px 75px);border-left:5px solid #aab5c5;border-right:5px solid #aab5c5;position:relative;overflow:hidden;border-radius:12px}.runlane{position:absolute;width:33.333%;height:100%;top:0;border-left:2px dashed #e4ecfa24;pointer-events:none}.car{position:absolute;bottom:12px;width:53px;height:77px;background:#46e3bd;border-radius:19px 19px 9px 9px;transition:left .1s;box-shadow:inset 0 12px #ffffff56}.obstacle{position:absolute;width:53px;height:68px;background:#fa6477;border-radius:12px}.msg{font-size:19px;font-weight:850;text-align:center}.wordgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:310px;direction:ltr}.wordgrid .cell{aspect-ratio:1;background:#252b3d;border:1px solid #65708b;font-size:23px}.miniinput{background:#252e42;color:#fff;border:2px solid #4c6487;border-radius:12px;padding:12px;font-size:24px;text-transform:uppercase;max-width:280px;width:100%;text-align:center;letter-spacing:7px}.small{font-size:12px}#stage svg{max-width:100%}@media(max-width:440px){h1{font-size:20px}#game{padding:9px}main{padding:9px}.cell{font-size:17px}.flip{height:60px}.bottle{width:48px;height:116px}}
</style></head><body><main><header><div><h1 id="name">TapTop</h1><p id="sub">ألعاب مباشرة</p></div><button id="again" type="button" class="primary">↻ إعادة</button></header><div id="game"><div id="status"></div><div id="stage"></div><div class="toolbar" id="toolbar"></div></div><p class="muted">لعبة أصلية خفيفة، تعمل مباشرة على الهاتف والكمبيوتر — TapTop</p></main><script src="./games.js"></script></body></html>
